<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Цены — Albion Market Table</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="site-chrome"></div>
  <header class="page-header">
    <h1>💰 Цены по городам</h1>
    <div class="controls">
      <input id="search" type="text" placeholder="Поиск по названию или ID (T4_PLANKS)..." />
      <select id="category-filter">
        <option value="">Все категории</option>
        <option value="raw">Сырьё</option>
        <option value="refined">Переработанное</option>
        <option value="weapon">Оружие</option>
        <option value="armor">Броня</option>
        <option value="cape">Плащи</option>
      </select>
      <select id="tier-filter">
        <option value="">Любой тир</option>
        <option value="2">T2</option><option value="3">T3</option><option value="4">T4</option>
        <option value="5">T5</option><option value="6">T6</option><option value="7">T7</option><option value="8">T8</option>
      </select>
      <select id="quality-select" title="Качество предмета">
        <option value="1">Обычное</option>
        <option value="2">Хорошее</option>
        <option value="3">Выдающееся</option>
        <option value="4">Отличное</option>
        <option value="5">Шедевр</option>
      </select>
      <select id="enchant-select" title="Уровень зачарования (для ресурсов T4+, у камня — максимум 3)">
        <option value="0">Без зачар.</option>
        <option value="1">Зачар. 1</option><option value="2">Зачар. 2</option>
        <option value="3">Зачар. 3</option><option value="4">Зачар. 4</option>
      </select>
      <button id="add-selected">Добавить в таблицу</button>
      <button id="add-filtered" title="Добавить все предметы, подходящие под текущий фильтр категории/тира">Добавить всё по фильтру</button>
      <button id="refresh">Обновить цены</button>
      <label class="auto-refresh">
        <input type="checkbox" id="auto-refresh-toggle" />
        авто-обновление (5 мин)
      </label>
    </div>
    <div id="suggestions" class="suggestions"></div>
  </header>
  <main>
    <div id="status" class="status"></div>
    <div class="table-scroll">
    <table id="price-table">
      <thead>
        <tr id="table-head">
          <th data-sort="name">Предмет</th>
          <th data-sort="spread">Спред (max-min)</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script src="js/prices.js"></script>
</body>
</html>
